<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Para Yareni</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      color: white;
      font-family: 'Poppins', sans-serif;
    }
    #scrollContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      pointer-events: none;
    }
    #dedicatoria {
      padding: 40px;
      font-size: 20px;
      white-space: pre-wrap;
    }
    canvas {
      display: block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>
</head>
<body>
  <audio id="bgMusic" src="take-on-me.mp3" preload="auto"></audio>
  <div id="scrollContainer">
    <div id="dedicatoria"></div>
  </div>
  <script>
    let frases = ["Hola pá ;)", "Feliz cumpleaños"];
    let clickCount = 0;
    let fraseIndex = 0;
    let gotas = [];
    let mostrarDedicatoria = false;
    let mensajeFinalizado = false;
    let musicaIniciada = false;

    let textoBase = "Hola papá jajaja ... Que tal??? ... Te deseo un muy feliz honomástico ... Como alguna vez dijiste hace mucho tiempo ... Soy yo ... Tú hijo Caleb jajakaks ... En fin ... Que tal te ha ido ??? ... Yo espero que bien ... La verdad es que no sé que decir ... Cumples un año más de vida ... Y hoy lo celebras ... Pero es que hoy no es el cumpleaños de cualquiera ... Hoy es el cumpleaños del gran Hubert William Chafloque Agapito ... Nada más y nada menos que "El importador" (espero no te moleste que te llame así ;) ... ) .... En serio eres un gran ejemplo a seguir ... No solo para mí o mi hermana, sino para toda la familia en general ... Todo lo que has logrado ... Tú gran emprendimiento que sigue en pie hasta el día de hoy ... Y que va en ascenso ... En serio eres una persona admirable ... Que nos has sabido aconsejar a mí y ami hermana ... Y estamos muy agradecidos de todo lo que has hecho por nosotros hasta el día de hoy ... Gracias por darme mis estudios ... Ayudarme a ingresar a la universidad ... Aconsejarme en varios aspectos de la vida ... Estar allí aunque sea a la distancia ... En verdad muchas gracias ... En lo personal no me gusta celebrar los cumpleaños ... A veces pienso que es como un recordatorio de que poco a poco vamos envejeciendo y que tarde o temprano moriremos ... Pero bueno ... De corazón espero que la pases muy bien 👻👻👻 ... Nd más no te descontroles con la cerveza jajaja ... Saludos a la señora Dessire y espero estar invitado a su boda ... 👀";
    let textoVisible = "";
    let indexLetra = 0;
    let tiempoEscritura = 0;
    let velocidadEscritura = 100;
    let borrando = false;
    let borrarDesde = null;
    let esperando = false;
    let tiempoEspera = 0;
    let borrandoFinal = false;
    let coloresTexto = ["#00ffc3", "#00ffc3", "#00ffc3"];

    let partesABorrar = [
      { texto: "asdoiafoian", borrado: false },
      { texto: "Se te extraña", borrado: false }
    ];

    let particulas = [];

    // Array para almacenar el color actual de cada letra en la dedicatoria
    let coloresPorLetra = [];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      textSize(26);
      textAlign(CENTER, CENTER);
      textFont('Poppins');
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    function mousePressed() {
      if (!musicaIniciada) {
        let audio = document.getElementById("bgMusic");
        audio.play();
        musicaIniciada = true;
      }

      if (!mostrarDedicatoria) {
        clickCount++;
        if (clickCount % 2 === 0) {
          fraseIndex = (fraseIndex + 1) % frases.length;
          for (let g of gotas) {
            g.texto = frases[fraseIndex];
          }
        }
        if (clickCount >= 30) {
          mostrarDedicatoria = true;
          document.getElementById("scrollContainer").style.pointerEvents = "auto";
          crearParticulas();
        }

        for (let i = 0; i < 20; i++) {
          let ang = random(TWO_PI);
          let speed = random(2, 6);
          gotas.push({
            x: mouseX,
            y: mouseY,
            dx: cos(ang) * speed,
            dy: sin(ang) * speed,
            texto: frases[fraseIndex],
            alpha: 255,
            explosion: true
          });
        }
      }
    }

    function crearParticulas() {
      for (let i = 0; i < 100; i++) {
        particulas.push({
          x: random(width),
          y: random(height),
          dx: random(-0.3, 0.3),
          dy: random(-0.3, 0.3),
          size: random(2, 4),
          alpha: random(150, 255),
          color: random(coloresTexto)
        });
      }
    }

    function moverYdibujarParticulas() {
      for (let p of particulas) {
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > width) p.dx *= -1;
        if (p.y < 0 || p.y > height) p.dy *= -1;

        fill(p.color + hex(p.alpha, 2));
        noStroke();
        ellipse(p.x, p.y, p.size);
      }
    }

    function draw() {
      background(0, 100);

      // Fondo de partículas si estamos en dedicatoria
      if (mostrarDedicatoria) {
        moverYdibujarParticulas();
      }

      // Contador de clics
      fill(255);
      textSize(20);
      textAlign(LEFT, TOP);
      text("Clics: " + clickCount, 20, 20);

      // Lluvia de frases
      if (!mostrarDedicatoria) {
        textAlign(CENTER, CENTER);
        textSize(24);
        if (frameCount % 8 === 0) {
          let x = random(width);
          let y = -30;
          let speed = random(2, 4);
          gotas.push({
            x: x,
            y: y,
            speed: speed,
            alpha: 255,
            texto: frases[fraseIndex],
            explosion: false
          });
        }

        for (let i = gotas.length - 1; i >= 0; i--) {
          let g = gotas[i];
          let color = random(coloresTexto);
          fill(color + hex(g.alpha, 2));
          text(g.texto, g.x, g.y);

          if (g.explosion) {
            g.x += g.dx;
            g.y += g.dy;
            g.alpha -= 5;
          } else {
            g.y += g.speed;
            g.alpha -= 1.5;
          }

          if (g.alpha <= 0 || g.y > height + 50) {
            gotas.splice(i, 1);
          }
        }
      }

      // Dedicatoria con máquina de escribir y cambio dinámico de color indefinido, sin borrado
      if (mostrarDedicatoria) {
        if (!borrandoFinal && !borrando && !esperando && millis() - tiempoEscritura > velocidadEscritura && indexLetra < textoBase.length) {
          textoVisible += textoBase[indexLetra];
          indexLetra++;
          tiempoEscritura = millis();
        }

        for (let parte of partesABorrar) {
          if (!parte.borrado && textoVisible.includes(parte.texto)) {
            borrarDesde = textoVisible.lastIndexOf(parte.texto);
            esperando = true;
            tiempoEspera = millis();
            parte.borrado = true;
            break;
          }
        }

        if (esperando && millis() - tiempoEspera >= 1300) {
          borrando = true;
          esperando = false;
        }

        if (borrando && millis() - tiempoEscritura > velocidadEscritura) {
          textoVisible = textoVisible.slice(0, textoVisible.length - 1);
          tiempoEscritura = millis();
          if (textoVisible.length <= borrarDesde) {
            borrando = false;
          }
        }

        // Elimina el borrado final para que la dedicatoria no desaparezca
        // if (!borrando && indexLetra >= textoBase.length && !esperando && !mensajeFinalizado) {
        //   mensajeFinalizado = true;
        //   setTimeout(() => {
        //     borrandoFinal = true;
        //     indexLetra = textoVisible.length;
        //   }, 1000);
        // }
        //
        // if (borrandoFinal && millis() - tiempoEscritura > velocidadEscritura) {
        //   textoVisible = textoVisible.substring(1);
        //   tiempoEscritura = millis();
        // }

        // Aseguramos que el array coloresPorLetra tenga la longitud correcta
        while (coloresPorLetra.length < textoVisible.length) {
          coloresPorLetra.push(random(coloresTexto));
        }
        while (coloresPorLetra.length > textoVisible.length) {
          coloresPorLetra.pop();
        }

        // Cambiamos el color de cada letra cada 4 frames para efecto más rápido
        if (frameCount % 4 === 0) {
          for (let i = 0; i < coloresPorLetra.length; i++) {
            coloresPorLetra[i] = random(coloresTexto);
          }
        }

        // Renderizamos la dedicatoria con colores dinámicos
        let dedicatoriaHTML = "";
        for (let i = 0; i < textoVisible.length; i++) {
          dedicatoriaHTML += `<span style="color:${coloresPorLetra[i]}">${textoVisible[i]}</span>`;
        }
        document.getElementById("dedicatoria").innerHTML = dedicatoriaHTML;
      }
    }
  </script>
</body>
</html>
